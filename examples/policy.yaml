# Example envgit policy — see docs/design.md §3.2
filesystem:
  read:  { deny: ["~/.ssh", "~/.aws", "**/.env"], allow: ["."] }
  write: { allow: [".", "/tmp"], deny: [".env"] }
network:
  allow: ["api.github.com:443", "registry.npmjs.org"]
  l7:
    api.github.com: { methods: [GET] }
capabilities:            # what the REPL (`envgit mcp`) exposes as functions
  fs: true
  shell: false
# MCP servers whose tools become REPL functions: `await github.list_issues({ owner, repo })`. They run
# inside the sandbox, so their requests meet the rules above; `${VAR}` comes from envgit's environment.
# `capabilities.<name>: [tool, …]` keeps only those tools, `false` turns a server off.
# mcp:
#   github:
#     command: github-mcp-server
#     args: [stdio, --read-only]
#     env: { GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_TOKEN}" }
# Irreversible actions cross the snapshot boundary, so rewind cannot undo them. Each is gated:
# action: ask (default) asks at the terminal or the MCP client, deny refuses, allow only marks the step.
# Net rules see HTTPS requests because the proxy terminates TLS when any request rule exists.
# Paths: `*` is one segment, `**` any. Shell rules match the command line envgit runs, and the simple
# commands of an `sh -c` script; quoting, subshells or variables get past them, which is why the net
# rule is the one that enforces.
irreversible:
  - net: { host: "github.com", method: POST, path: "/**/git-receive-pack" }   # git push over HTTPS
  - net: { host: "api.github.com", method: POST, path: "/repos/*/*/issues" }
  - net: { host: "registry.npmjs.org", method: PUT }                          # npm publish
  - shell: ["git push", "npm publish"]
# Snapshots are fs-level on the srt backend. Uncomment to leave paths out of them
# (an unchanged tree costs one stat per file, so large dirs are usually fine).
# snapshot:
#   exclude: ["node_modules"]
#   maxBytes: 10G      # drop the oldest rewind points (never base, head or the last 10 steps) to stay under
